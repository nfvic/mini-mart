<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS / Sales · MiniMart</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrap">
      <header class="topbar" id="appTopbar"></header>
      <main class="content">
        <div class="pos-layout">
          <section class="card">
            <div class="card-header">
              <h3>Product catalogue</h3>
              <input type="search" id="posSearch" class="form-control" style="max-width:240px" placeholder="Search products..." />
            </div>
            <div class="product-picker" id="productPicker"></div>
          </section>

          <section class="card cart-panel">
            <div class="card-header"><h3>Shopping cart</h3></div>
            <div class="form-group">
              <label for="saleCustomer">Customer</label>
              <select id="saleCustomer" class="form-control"></select>
            </div>
            <div class="cart-lines" id="cartLines"></div>
            <div class="cart-totals" id="cartTotals"></div>
            <div class="grid grid-2 mt-2">
              <div class="form-group">
                <label for="paymentMethod">Payment method</label>
                <select id="paymentMethod" class="form-control"></select>
              </div>
              <div class="form-group">
                <label for="amountPaid">Amount paid (KES)</label>
                <input type="number" min="0" step="0.01" id="amountPaid" class="form-control" />
              </div>
            </div>
            <p id="changeDisplay" class="text-muted"></p>
            <div class="actions">
              <button type="button" class="btn btn-outline" id="btnClearCart">Clear cart</button>
              <button type="button" class="btn btn-primary" id="btnCompleteSale">Complete sale</button>
            </div>
          </section>
        </div>

        <div class="card mt-2">
          <div class="card-header">
            <h3>Recent sales history</h3>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Receipt</th>
                  <th>Date</th>
                  <th>Customer</th>
                  <th>Payment</th>
                  <th>Total</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="salesHistory"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="receiptModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Sale receipt</h3>
        <button type="button" class="icon-btn" data-close-modal="receiptModal">×</button>
      </div>
      <div class="modal-body">
        <div id="receiptContent" class="receipt-box"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close-modal="receiptModal">Close</button>
        <button type="button" class="btn btn-primary" id="btnPrintReceipt">Print receipt</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
