<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purchases · MiniMart</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrap">
      <header class="topbar" id="appTopbar"></header>
      <main class="content">
        <div class="toolbar">
          <button type="button" class="btn btn-primary" id="btnNewPurchase">Record purchase</button>
          <input type="search" id="purchaseSearch" class="form-control" placeholder="Search purchases..." />
        </div>
        <div class="card">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Purchase No</th>
                  <th>Date</th>
                  <th>Supplier</th>
                  <th>Items</th>
                  <th>Payment</th>
                  <th>Total</th>
                  <th>Notes</th>
                </tr>
              </thead>
              <tbody id="purchasesTable"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="purchaseModal">
    <div class="modal-dialog wide">
      <form id="purchaseForm">
        <div class="modal-header">
          <h3>New purchase</h3>
          <button type="button" class="icon-btn" data-close-modal="purchaseModal">×</button>
        </div>
        <div class="modal-body">
          <div class="grid grid-2">
            <div class="form-group">
              <label for="purchaseSupplier">Supplier</label>
              <select id="purchaseSupplier" class="form-control" required></select>
            </div>
            <div class="form-group">
              <label for="purchaseDate">Date</label>
              <input type="date" id="purchaseDate" class="form-control" required />
            </div>
          </div>
          <div class="grid grid-2">
            <div class="form-group">
              <label for="purchasePayment">Payment method</label>
              <select id="purchasePayment" class="form-control"></select>
            </div>
            <div class="form-group">
              <label for="purchaseNotes">Notes</label>
              <input id="purchaseNotes" class="form-control" placeholder="Optional notes" />
            </div>
          </div>
          <div class="card-header" style="padding:0;margin:8px 0 10px">
            <h3 style="font-size:1rem">Purchase lines</h3>
            <button type="button" class="btn btn-sm btn-secondary" id="btnAddPurchaseLine">Add line</button>
          </div>
          <div id="purchaseLines"></div>
          <p class="mt-2"><strong>Total: </strong><span id="purchaseTotal">KES 0.00</span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-modal="purchaseModal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save purchase</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/purchases.js"></script>
</body>
</html>
