<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports · MiniMart</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="main-wrap">
      <header class="topbar" id="appTopbar"></header>
      <main class="content">
        <div class="report-tabs" id="reportTabs"></div>
        <div class="report-filters no-print">
          <input type="date" id="reportFrom" class="form-control" />
          <input type="date" id="reportTo" class="form-control" />
          <input type="search" id="reportSearch" class="form-control" placeholder="Search records..." />
          <button type="button" class="btn btn-secondary" id="btnRunReport">Run report</button>
          <button type="button" class="btn btn-outline" id="btnPrintReport">Print</button>
          <button type="button" class="btn btn-primary" id="btnExportCSV">Export CSV</button>
        </div>
        <div class="finance-grid" id="reportSummary"></div>
        <div class="card chart-card mb-2">
          <div class="card-header"><h3 id="reportChartTitle">Report chart</h3></div>
          <canvas id="reportChart" width="900" height="260"></canvas>
        </div>
        <div class="card" id="reportPrintArea">
          <div class="card-header"><h3 id="reportTitle">Report</h3></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead id="reportHead"></thead>
              <tbody id="reportBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
